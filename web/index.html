<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>World Signal Engine — Kozmik Sinyal Merkezi</title>
  <meta name="description" content="Live world observation and broadcast studio." />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/broadcast.css" />
  <link rel="stylesheet" href="/styles/blocks.css" />
  <link rel="stylesheet" href="/styles/transitions.css" />
  <link rel="stylesheet" href="/styles/broadcast-responsive.css" />
</head>
<body>
  <a class="skip-link" href="#stage">Skip to the broadcast</a>

  <div class="shell">
    <!-- The only persistent UI: is this live, what is it, which scene, what time. -->
    <div id="chrome"></div>

    <!-- Where scenes are composed. Nothing here scrolls the page. -->
    <main id="stage" class="stage" role="main" aria-label="Broadcast stage">
      <div id="boot" class="boot">
        <div class="boot-title">Composing the broadcast</div>
        <div class="boot-steps">
          <div class="boot-step" data-state="ok">blocks registered</div>
          <div class="boot-step" data-state="pending">scene composed</div>
          <div class="boot-step" data-state="pending">stream connected</div>
        </div>
      </div>
      <div id="watermark" class="stage-watermark" hidden>
        <div class="stage-watermark-text"></div>
      </div>
    </main>

    <!-- The running headline strip. Hidden when there is nothing to say. -->
    <div id="ticker"></div>
  </div>

  <!-- Takeover layer. Empty until the director hands over the screen. -->
  <div id="overlay"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
