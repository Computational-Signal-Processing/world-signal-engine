[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/baseline",
    "crates/detection",
    "crates/storage",
    "crates/collector",
    "crates/normalize",
    "crates/correlation",
    "crates/signals",
    "crates/scheduler",
    "crates/engine",
    "crates/api",
    "crates/cli",
    "crates/sources",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Computational-Signal-Processing/world-signal-engine"
authors = ["World Signal Engine Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
