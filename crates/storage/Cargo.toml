[package]
name = "wse-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Storage abstractions, in-memory backend and SQLite persistence for the World Signal Engine."

[features]
default = []
# SQLite persistence. Optional so the synthetic world and the test suite build
# without a C compiler or a bundled SQLite.
sqlite = ["dep:rusqlite"]

[dependencies]
wse-model = { path = "../model" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
